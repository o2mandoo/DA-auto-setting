name: packaging-clean-clone

on:
  push:
  pull_request:

env:
  PYTHON: python
  SDC_LLM_ENABLED: "0"
  SEMANTIC_WEAVIATE_ENABLED: "0"
  SEMANTIC_POSTGRES_ENABLED: "0"
  SEMANTIC_MYSQL_ENABLED: "0"
  SEMANTIC_CONTEXT_FIXTURE_DB: "0"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install editable local packages
        run: |
          python -m pip install -e packages/semantic_contracts
          python -m pip install -e packages/semantic_registry
          python -m pip install -e packages/semantic_mcp
          python -m pip install -e 'packages/semantic_builder[test]'

      - name: Run make env-check
        run: make env-check

      - name: Run contracts tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/contracts 2>&1 | tee reports/ci/contracts.log

      - name: Run builder tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/builder 2>&1 | tee reports/ci/builder.log

      - name: Run registry tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/registry 2>&1 | tee reports/ci/registry.log

      - name: Run mcp tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/mcp 2>&1 | tee reports/ci/mcp.log

      - name: Run product tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/product 2>&1 | tee reports/ci/product.log

      - name: Run security tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/security 2>&1 | tee reports/ci/security.log

      - name: Run e2e tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/e2e 2>&1 | tee reports/ci/e2e.log

      - name: Run eval tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/eval 2>&1 | tee reports/ci/eval.log

      - name: Run fixtures tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/fixtures 2>&1 | tee reports/ci/fixtures.log

      - name: Run integration tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/integration 2>&1 | tee reports/ci/integration.log

      - name: Run packaging tests
        run: |
          mkdir -p reports/ci
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/packaging 2>&1 | tee reports/ci/packaging.log

      - name: Run release tests
        run: make release-test

      - name: Generate release packet
        run: make release-pack RELEASE_ID=ci-smoke RELEASE_OUT=reports/release

      - name: Scan release packet and workflow safety
        run: make release-scan RELEASE_ID=ci-smoke RELEASE_OUT=reports/release

      - name: Validate clone-ready setup helper
        run: python scripts/setup/clone_ready_setup.py

      - name: Validate environment contract
        run: bash scripts/setup/env_check.sh

      - name: Run packaging smoke tests
        run: python -m unittest discover -s tests/packaging -v

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-logs
          path: reports/ci

      - name: Upload release packet evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-release-packet
          path: reports/release/ci-smoke
