openapi: 3.1.0
info:
  title: Semantic Data Context Product API
  version: 0.1.0-local
security:
  - demoHeader: []
components:
  securitySchemes:
    demoHeader:
      type: apiKey
      in: header
      name: x-sdc-demo-key
  headers:
    CorrelationId:
      description: Correlation ID for request tracing and typed error reporting.
      schema:
        type: string
  schemas:
    TypedError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        detail: {type: string, nullable: true}
        correlation_id: {type: string, nullable: true}
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: {type: string}
        correlation_id: {type: string, nullable: true}
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status: {type: string}
        pack_root: {type: string, nullable: true}
        config_ready: {type: boolean}
        correlation_id: {type: string, nullable: true}
    ProductAnswerRequest:
      type: object
      required: [question]
      properties:
        question: {type: string}
        space_id: {type: string, default: demo_company.revenue}
        role: {type: string, default: marketing_analyst}
        mode: {type: string, enum: [A_ONBOARDING, B_REGISTRY, C_QUERY_RUNTIME, D_BENCHMARK]}
        include_preview: {type: boolean, default: false}
    CompareSqlRequest:
      type: object
      required: [question, baseline_sql]
      properties:
        question: {type: string}
        baseline_sql: {type: string}
        system_sql: {type: string, nullable: true}
        space_id: {type: string}
        role: {type: string}
paths:
  /healthz:
    get:
      summary: Report process health
      x-safety: transport only
      responses:
        "200":
          description: Health response
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Report readiness and explicit errors
      x-safety: explicit typed errors, no silent fallback
      responses:
        "200":
          description: Readiness response
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Typed readiness failure
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedError"
  /openapi.json:
    get:
      summary: Return the route inventory
      x-safety: no production SQL execution
      responses:
        "200":
          description: OpenAPI-like inventory
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
  /api/onboarding/run:
    post:
      summary: Record onboarding request
      x-safety: no production connections
  /api/confirmation/session:
    post:
      summary: Open confirmation session
      x-safety: no approved-pack mutation
  /api/confirmation/answer:
    post:
      summary: Record human answer
      x-safety: audit only
  /api/pack/promote:
    post:
      summary: Validate explicit promotion preconditions
      x-safety: versioned proposal only
  /api/product/answer:
    post:
      summary: Return answer comparison view model
      x-safety: execution_allowed is always false
  /api/product/compare-sql:
    post:
      summary: Compare SQL text candidates
      x-safety: no SQL execution
  /api/eval/run:
    post:
      summary: Run/read product evidence
      x-safety: reports only
  /api/failure-review/run:
    post:
      summary: Run failure-safe red-team scenarios
      x-safety: reports only
